# 复制本文件为 config.ini 后填写真实值：
#   cp config.example.ini config.ini
# config.ini 已被 git 忽略，请勿提交。

[server]
# debug：开发模式； release：生产模式
AppMode = debug
HttpPort = :3000

[database]
Db = mysql
DbHost = localhost
DbPort = 3306
DbUser = your_db_user
DbPassWord = your_db_password
DbName = base

[security]
# 建议使用足够长的随机字符串（例如 openssl rand -hex 16）
aes_secret_key = replace_with_random_hex

[reminder]
# 定时检查间隔（分钟）
check_interval = 1

[email]
SenderEmail = "your@qq.com"
SmtpServer  = "smtp.qq.com"
SmtpPort    = "465"
SmtpPass    = "your_smtp_auth_code"
