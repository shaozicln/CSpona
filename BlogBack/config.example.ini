# 复制本文件为 config.ini 后填写真实值：
#   cp config.example.ini config.ini
# config.ini 已被 git 忽略，请勿提交。

[server]
# debug：开发模式； release：生产模式（生产务必 release，否则图片目录会指错）
AppMode = debug
HttpPort = :3000

[database]
Db = mysql
DbHost = localhost
DbPort = 3306
DbUser = your_db_user
DbPassWord = your_db_password
DbName = base

[security]
# 必须是十六进制，解码后为 16/24/32 字节（即 32/48/64 个 hex 字符）
# 生成示例：openssl rand -hex 16
aes_secret_key = 0123456789abcdef0123456789abcdef

# 图片磁盘目录（可选）。留空则：
#   release → /www/server/go_project/cspona/dist/Pictures
#   debug   → ../BlogFont/public/Pictures
[upload]
Dir =

# 首页「关于我」Markdown（可选）。留空则默认 content/about-me.md
[content]
AboutMe =

# 站点默认背景音乐配置 JSON（可选）。留空则默认 content/music-default.json
[music]
Settings =
# 可选：优先使用的 Meting API（失败会自动回退其它源）
MetingAPI = https://api.injahow.cn/meting

[reminder]
check_interval = 1

[email]
SenderEmail = "your@qq.com"
SmtpServer  = "smtp.qq.com"
SmtpPort    = "465"
SmtpPass    = "your_smtp_auth_code"
